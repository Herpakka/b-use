name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --shm-size=2g
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bu
          POSTGRES_PASSWORD: bu
          POSTGRES_DB: bu
        options: >-
          --health-cmd "pg_isready -U bu -d bu"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      UV_PYTHON_DOWNLOADS: never
      BU_DATABASE_URL: postgresql://bu:bu@postgres:5432/bu
      BU_SESSIONS_DIR: /tmp/bu-sessions
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
      - run: uv sync --frozen
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run lint-imports
      - name: type
        run: uv run mypy
      - name: test
        run: uv run pytest -m "not live and not llm"
