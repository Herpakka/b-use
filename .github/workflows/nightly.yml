name: nightly-eval

# 5.1: the 30-task suite against live sites with the real model, every night (02:00 Bangkok),
# compared with the previous night's report. Needs the repository secret OPENAI_API_KEY.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these task ids (space separated); empty = all"
        required: false

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --shm-size=2g
    env:
      UV_PYTHON_DOWNLOADS: never
      BU_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BU_SESSIONS_DIR: /tmp/bu-sessions
      BU_EVENT_BUS: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
      - run: uv sync --frozen
      - name: previous reports
        uses: actions/cache/restore@v4
        with:
          path: evals/reports
          key: eval-reports-${{ github.run_id }}
          restore-keys: eval-reports-
      - name: 30-task eval (≥ 70 % to pass)
        run: |
          only=""
          for id in ${{ github.event.inputs.only }}; do only="$only --only $id"; done
          uv run python -m evals.runner evals/tasks.yaml --min-rate 0.7 \
            --summary-md "$GITHUB_STEP_SUMMARY" $only
      - name: adversarial suite against the real model
        if: always()
        run: uv run pytest tests/adversarial -m llm -q
      - name: keep reports for tomorrow's comparison
        if: always()
        uses: actions/cache/save@v4
        with:
          path: evals/reports
          key: eval-reports-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/tasks-*.json
          retention-days: 30
