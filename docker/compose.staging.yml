# Staging: the production image, two replicas behind Caddy, with Prometheus and Grafana.
#   docker compose -f docker/compose.staging.yml up -d --build
#   http://localhost:8088          API + /debug, through the proxy
#   http://localhost:3001          Grafana (dashboard "Browser agent")
#   http://localhost:9095          Prometheus
# Tracing goes to the Langfuse already running on the host (LANGFUSE_* keys in .env).
name: browser-use-staging

x-app-env: &app-env
  BU_ENV: prod
  BU_DATABASE_URL: postgresql://bu:bu@postgres:5432/bu
  BU_REDIS_URL: redis://redis:6379/0
  BU_EVENT_BUS: redis
  # Headless Chromium inside each replica, not the developer's desktop browser from .env.
  BU_BROWSER_WS_ENDPOINT: ""
  BU_HEADLESS: "true"
  BU_MAX_CONTEXTS: "4"
  BU_DRAIN_TIMEOUT_S: "60"
  BU_DEBUG_PAGE: "true"
  BU_SESSIONS_DIR: /data/sessions
  LANGFUSE_HOST: http://host.docker.internal:7453

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    image: browser-use:prod
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2560m
    # Chromium needs a big /dev/shm; without it tabs crash silently.
    shm_size: "2gb"
    # Runs get BU_DRAIN_TIMEOUT_S to finish on SIGTERM; leave room for that and the cleanup.
    stop_grace_period: 90s
    env_file:
      - path: ../.env
        required: false
    environment: *app-env
    volumes:
      # Shared: a run adopted by the other replica finds its cookies here.
      - sessions:/data/sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: caddy:2.10-alpine
    ports:
      - "8088:8080"
    volumes:
      - ./staging/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bu
      POSTGRES_PASSWORD: bu
      POSTGRES_DB: bu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bu -d bu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9095:9090"
    volumes:
      - ./staging/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/browser-agent.json
    volumes:
      - ./staging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./staging/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  sessions:
  pgdata:
